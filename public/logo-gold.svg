<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DrawFi">
  <title>DrawFi — champagne</title>
  <!-- Premium variant: charcoal badge, champagne-gold rim and letter, pips in
       the same metal. For a launch banner or a treasury page, not the favicon. -->
  <defs>
    <linearGradient id="goldF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e7b6" />
      <stop offset="0.5" stop-color="#ddb965" />
      <stop offset="1" stop-color="#a9812f" />
    </linearGradient>
    <linearGradient id="coalF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b26" />
      <stop offset="1" stop-color="#070a0f" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#coalF)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#goldF)" stroke-opacity="0.7" stroke-width="1.5" />

  <path
    fill="url(#goldF)"
    fill-rule="evenodd"
    d="M17 15 H31 A17 17 0 0 1 31 49 H17 Z
       M24.5 21.5 H31 A10.5 10.5 0 0 1 31 42.5 H24.5 Z"
  />

  <g fill="url(#goldF)">
    <circle cx="32" cy="27.5" r="1.9" />
    <circle cx="34.6" cy="32" r="1.9" />
    <circle cx="37.2" cy="36.5" r="1.9" />
  </g>
</svg>
