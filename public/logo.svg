<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DrawFi">
  <title>DrawFi</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8cff" />
      <stop offset="1" stop-color="#0466e8" />
    </linearGradient>
  </defs>

  <!-- Rounded badge: keeps the mark legible on light and dark backgrounds -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#badge)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.16" />

  <!-- The D: flat stem on the left, a half-circle bowl on the right, counter
       punched out with fill-rule so the badge colour shows through -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M17 15 H31 A17 17 0 0 1 31 49 H17 Z
       M24.5 21.5 H31 A10.5 10.5 0 0 1 31 42.5 H24.5 Z"
  />

  <!-- Dice touch: a diagonal 3 inside the counter, same white as the letter -->
  <g fill="#ffffff">
    <circle cx="32" cy="27" r="2.1" />
    <circle cx="34.5" cy="32" r="2.1" />
    <circle cx="37" cy="37" r="2.1" />
  </g>
</svg>
